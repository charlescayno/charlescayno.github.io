<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tools &amp; Projects</title>
<meta name="description" content="Charles Cayno's personal tools and projects." />
<style>
  :root { --fg:#fff; --mute:#8a8d91; --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    background:#000; color:var(--fg);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; text-decoration:none; }

  nav {
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 40px; background:linear-gradient(#000a,transparent);
    font-size:12px; letter-spacing:.2em; text-transform:uppercase;
  }
  nav .brand { font-weight:700; letter-spacing:.35em; }
  nav a.link { color:var(--mute); transition:color .2s; }
  nav a.link:hover { color:#fff; }

  .hero {
    min-height:100vh; display:flex; flex-direction:column; justify-content:flex-end;
    padding:0 40px 80px;
    background:
      linear-gradient(180deg,rgba(0,0,0,.2),#000 95%),
      radial-gradient(ellipse at 70% 30%,#1c232b 0%,#000 65%);
  }
  .hero h1 {
    font-size:clamp(40px,8vw,104px); font-weight:700; line-height:1;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .hero p { margin-top:20px; color:var(--mute); font-size:14px; letter-spacing:.2em; text-transform:uppercase; }
  .cta {
    display:inline-block; margin-top:36px; padding:14px 34px;
    border:1px solid var(--fg); font-size:12px; letter-spacing:.25em; text-transform:uppercase;
    transition:background .25s,color .25s;
  }
  .cta:hover { background:#fff; color:#000; }

  section { padding:100px 40px; max-width:1200px; margin:0 auto; }
  .label { font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--mute); margin-bottom:40px; }

  .row {
    display:grid; grid-template-columns:60px 1fr 1fr 40px; gap:20px; align-items:center;
    padding:26px 0; border-top:1px solid var(--line); transition:padding .25s, background .25s;
  }
  .row:last-child { border-bottom:1px solid var(--line); }
  .row:hover { padding-left:14px; background:rgba(255,255,255,.04); }
  .row .n { color:var(--mute); font-size:12px; letter-spacing:.2em; }
  .row .t { font-size:18px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  .row .d { color:var(--mute); font-size:14px; }
  .row .a { text-align:right; opacity:0; transition:opacity .25s; }
  .row:hover .a { opacity:1; }

  footer {
    border-top:1px solid var(--line); padding:32px 40px; display:flex; justify-content:space-between;
    font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute);
  }
  footer a:hover { color:#fff; }

  @media (max-width:700px){
    nav,.hero,section,footer{padding-left:20px;padding-right:20px}
    .row{grid-template-columns:36px 1fr 24px}
    .row .d{grid-column:2/3;grid-row:2}
    .row .a{opacity:1;grid-row:1;grid-column:3}
  }
</style>
</head>
<body>
<nav>
  <a class="brand" href="#">Cayno</a>
  <div style="display:flex;gap:32px">
    <a class="link" href="#projects">Projects</a>
    <a class="link" href="/resume/">Resume</a>
    <a class="link" href="https://github.com/charlescayno">GitHub</a>
  </div>
</nav>

<header class="hero">
  <h1>Tools &amp;<br>Projects</h1>
  <p>Web apps and calculators</p>
  <div><a class="cta" href="#projects">View Projects</a></div>
</header>

<section id="projects">
  <div class="label">Projects</div>
  <div id="list"></div>
</section>

<footer>
  <span>&copy; <span id="yr"></span> Charles Cayno</span>
  <a href="https://github.com/charlescayno">GitHub</a>
</footer>

<script>
  const items = [
    ["BP Log","Blood pressure tracker.","/bp-log/"],
    ["Wedding Guestlist","Manage wedding guests.","/wedding-guestlist/"],
    ["Magnetics Designer","Design and calculate magnetics.","/magnetics-designer/magnetics-designer.html"],
    ["Bybit Futures Calculator","Calculate Bybit futures.","/bybit-futures-calculator/"],
    ["Fuel Tracker","Track your fuel consumption.","/fuel-tracker/"],
    ["GLC Inventory","Inventory management.","/glc-inventory/"],
    ["Headshot Cropper","Image cropping tool.","/headshot-cropper/"],
    ["Innomux2 Calculator","Innomux2 tool.","/innomux2-calculator/"],
    ["Moneyku","Finance tracking app.","/moneyku/"],
    ["Volunteer Management","Manage volunteer schedules.","/volunteer-management/monitor.html"],
    ["Task Journal","Bullet journal task manager with calendar views.","/task-journal/"],
    ["GLC PR Encoder","Encode Provisional Receipts (PR).","/glc-pr-encoder/"],
    ["Resume","My professional resume.","/resume/"]
  ];
  document.getElementById("list").innerHTML = items.map(([t,d,h],i)=>
    `<a class="row" href="${h}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${t}</span><span class="d">${d}</span><span class="a">&rarr;</span></a>`
  ).join("");
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
